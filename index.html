    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe / preview containers
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? event.message : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
